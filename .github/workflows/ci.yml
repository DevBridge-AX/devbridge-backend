name: CI for DevBridge Backend

# PR 검증 전용 워크플로.
# 배포는 deploy.yml(push → main)이 담당하며, 이 워크플로는 배포에 관여하지 않는다.
on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    # Redis가 없어도 현재 58개 테스트는 통과한다. JwtHandshakeInterceptor.isBlacklisted()가
    # RedisConnectionFailureException을 catch해 항상 false를 반환하기 때문이다.
    # 다만 그 경우 토큰 블랙리스트 경로가 CI에서 전혀 검증되지 않으므로, 실제 경로를 태우기 위해 띄운다.
    # DB는 H2 인메모리를 사용하므로 별도 서비스가 필요 없다.
    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test/
          retention-days: 7
