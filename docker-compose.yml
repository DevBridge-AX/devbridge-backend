services:
  mysql:
    image: mysql:8.0
    container_name: devbridge-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: devbridge
      MYSQL_USER: ssafy
      MYSQL_PASSWORD: "1234"
    volumes:
      - ./.docker-data/mysql:/var/lib/mysql
    networks:
      - devbridge-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: devbridge-redis
    ports:
      - "6379:6379"
    volumes:
      - ./.docker-data/redis:/data
    networks:
      - devbridge-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: devbridge-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_HOST: mysql
      SPRING_DATASOURCE_PORT: 3306
      SPRING_DATASOURCE_DATABASE: devbridge
      SPRING_DATASOURCE_USERNAME: ssafy
      SPRING_DATASOURCE_PASSWORD: "1234"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - devbridge-network

networks:
  devbridge-network:
    driver: bridge
