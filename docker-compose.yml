services:
  mysql:
    image: mysql:8.0
    container_name: devbridge-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
    volumes:
      - ./.docker-data/mysql:/var/lib/mysql
      - ./init-db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - devbridge-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: devbridge-redis
    ports:
      - "6379:6379"
    volumes:
      - ./.docker-data/redis:/data
    networks:
      - devbridge-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: devbridge-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_HOST: mysql
      SPRING_DATASOURCE_PORT: 3306
      SPRING_DATASOURCE_DATABASE: "${MYSQL_DATABASE}"
      SPRING_DATASOURCE_USERNAME: "${MYSQL_USER}"
      SPRING_DATASOURCE_PASSWORD: "${MYSQL_PASSWORD}"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      INTERNAL_API_KEY: "${INTERNAL_API_KEY}"
      FASTAPI_BASE_URL: http://ai-engine:8000
      SPRING_MAIL_USERNAME: "${SPRING_MAIL_USERNAME}"
      SPRING_MAIL_PASSWORD: "${SPRING_MAIL_PASSWORD}"
    volumes:
      - ./.docker-data/uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - devbridge-network

  ai-engine:
    build:
      context: ../devbridge-ai-engine
      dockerfile: Dockerfile
    container_name: devbridge-ai-engine
    ports:
      - "8000:8000"
    volumes:
      - ./.docker-data/uploads:/app/uploads
      - ./.docker-data/vector_store:/app/data/vector_store
    env_file:
      - ../devbridge-ai-engine/.env
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER_AI}:${MYSQL_PASSWORD_AI}@devbridge-mysql:3306/devbridge
      SPRING_BACKEND_BASE_URL: http://app:8080
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - devbridge-network
    # TODO: FastAPI models.py를 Spring 스키마에 맞춰 동기화한 뒤 alembic upgrade head 복원 필요
    # sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    command: >
      sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000"

networks:
  devbridge-network:
    driver: bridge