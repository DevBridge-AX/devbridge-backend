spring:
  application:
    name: backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: jdbc:mysql://${SPRING_DATASOURCE_HOST:localhost}:${SPRING_DATASOURCE_PORT:3306}/${SPRING_DATASOURCE_DATABASE:devbridge_ax}?serverTimezone=Asia/Seoul&useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: ${SPRING_DATASOURCE_USERNAME:ssafy}
    password: ${SPRING_DATASOURCE_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            connectiontimeout: 5000
            timeout: 5000
            writetimeout: 5000

jwt:
  secret: ${JWT_SECRET:c2VjcmV0LWtleS1mb3ItZGV2YnJpZGdlLWFpLXByb2plY3QtYXV0aGVudGljYXRpb24=}

internal:
  api:
    key: ${INTERNAL_API_KEY:}

fastapi:
  base-url: ${FASTAPI_BASE_URL:http://localhost:8000}
  internal-api-key: ${INTERNAL_API_KEY:changeme}
  credit-rates:
    claude-sonnet-4-6:
      input: 0.03
      output: 0.15
    claude-haiku-4-5-20251001:
      input: 0.01
      output: 0.05
    gpt-5.4-nano:
      input: 0.001
      output: 0.004
    gemini-3.5-flash-lite:
      input: 0.001
      output: 0.004

server:
  port: 8080

devbridge:
  ai-engine:
    base-url: ${AI_ENGINE_BASE_URL:http://127.0.0.1:8010}
    internal-api-key: ${AI_ENGINE_INTERNAL_API_KEY:changeme}
    document-analysis-path: ${AI_ENGINE_DOCUMENT_ANALYSIS_PATH:/api/analysis/document}
    timeout-seconds: ${AI_ENGINE_TIMEOUT_SECONDS:30}
