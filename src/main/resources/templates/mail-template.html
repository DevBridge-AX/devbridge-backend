<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>DevBridge AX 이메일 인증</title>
</head>

<body style="margin: 0; padding: 0; background-color: #f4f5f7; font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif;">

    <!-- 외부 래퍼 테이블 -->
    <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #f4f5f7;">
        <tr>
            <td align="center" style="padding: 40px 16px;">

                <!-- 메인 카드 테이블 -->
                <table width="600" cellpadding="0" cellspacing="0" border="0"
                    style="max-width: 600px; width: 100%; background-color: #ffffff; border: 1px solid #e0e0e0;">

                    <!-- 헤더 -->
                    <tr>
                        <td align="center"
                            style="background-color: #8E77F6; padding: 28px 30px;">
                            <table width="100%" cellpadding="0" cellspacing="0" border="0">
                                <tr>
                                    <td align="center">
                                        <p style="margin: 0; font-size: 22px; font-weight: bold; color: #ffffff; letter-spacing: -0.5px;">
                                            DevBridge AX
                                        </p>
                                        <p style="margin: 6px 0 0; font-size: 13px; color: rgba(255,255,255,0.8);">
                                            이메일 인증 안내
                                        </p>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- 본문 -->
                    <tr>
                        <td style="padding: 36px 30px 28px; color: #333333;">
                            <p style="margin: 0 0 16px; font-size: 15px; line-height: 1.7; color: #333333;">
                                안녕하세요,
                            </p>
                            <p style="margin: 0 0 24px; font-size: 15px; line-height: 1.7; color: #333333;">
                                DevBridge AX 워크스페이스에 오신 것을 환영합니다!<br>
                                아래의 6자리 인증번호를 가입 화면에 입력하여 이메일 인증을 완료해 주세요.
                            </p>

                            <!-- 인증 코드 박스 -->
                            <table width="100%" cellpadding="0" cellspacing="0" border="0">
                                <tr>
                                    <td align="center"
                                        style="background-color: #f8f6ff; border: 1px solid #e0d8ff; padding: 24px 20px;">
                                        <p style="margin: 0 0 6px; font-size: 12px; color: #8E77F6; letter-spacing: 1px; font-weight: bold;">
                                            인증 코드
                                        </p>
                                        <p th:text="${authCode}"
                                            style="margin: 0; font-size: 36px; font-weight: bold; color: #4B73FF; letter-spacing: 8px; font-family: Arial, 'Courier New', monospace;">
                                            000000
                                        </p>
                                    </td>
                                </tr>
                            </table>

                            <!-- 유의사항 -->
                            <table width="100%" cellpadding="0" cellspacing="0" border="0" style="margin-top: 24px;">
                                <tr>
                                    <td style="background-color: #fafafa; border-left: 3px solid #8E77F6; padding: 12px 16px;">
                                        <p style="margin: 0; font-size: 13px; line-height: 1.8; color: #666666;">
                                            · 본 인증번호는 <strong style="color: #333333;">3분</strong> 동안만 유효합니다.<br>
                                            · 본인이 요청하지 않은 경우 이 메일을 무시해 주세요.
                                        </p>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- 구분선 -->
                    <tr>
                        <td style="padding: 0 30px;">
                            <table width="100%" cellpadding="0" cellspacing="0" border="0">
                                <tr>
                                    <td style="border-top: 1px solid #eeeeee; font-size: 0;">&nbsp;</td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- 푸터 -->
                    <tr>
                        <td align="center" style="padding: 18px 30px; background-color: #fafafa;">
                            <p style="margin: 0; font-size: 12px; color: #aaaaaa;">
                                © 2026 DevBridge Labs. All rights reserved.
                            </p>
                            <p style="margin: 4px 0 0; font-size: 11px; color: #cccccc;">
                                이 메일은 발신 전용입니다. 회신하지 마세요.
                            </p>
                        </td>
                    </tr>

                </table>
                <!-- /메인 카드 테이블 -->

            </td>
        </tr>
    </table>

</body>

</html>
