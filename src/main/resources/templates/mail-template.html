<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>DevBridge AX 이메일 인증</title>
    <style>
        body {
            font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            background-color: #f4f5f7;
            margin: 0;
            padding: 0;
        }

        .mail-container {
            max-width: 600px;
            margin: 40px auto;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        .mail-header {
            background-color: #8E77F6;
            padding: 30px;
            text-align: center;
        }

        .mail-header h1 {
            color: #ffffff;
            margin: 0;
            font-size: 24px;
            letter-spacing: -0.5px;
        }

        .mail-body {
            padding: 40px 30px;
            color: #333333;
            line-height: 1.6;
        }

        .mail-body p {
            font-size: 16px;
            margin-bottom: 20px;
        }

        .auth-code-box {
            background-color: #f8f6ff;
            border: 1px solid #e0d8ff;
            border-radius: 6px;
            padding: 20px;
            text-align: center;
            margin: 30px 0;
        }

        .auth-code {
            font-size: 32px;
            font-weight: bold;
            color: #4B73FF;
            letter-spacing: 4px;
        }

        .mail-footer {
            background-color: #fafafa;
            padding: 20px;
            text-align: center;
            font-size: 13px;
            color: #888888;
            border-top: 1px solid #eeeeee;
        }
    </style>
</head>

<body>
    <div class="mail-container">
        <div class="mail-header">
            <h1>DevBridge AX</h1>
        </div>
        <div class="mail-body">
            <p>안녕하세요,</p>
            <p>DevBridge AX 워크스페이스에 오신 것을 환영합니다!<br>아래의 6자리 인증번호를 가입 화면에 입력하여 이메일 인증을 완료해 주세요.</p>

            <div class="auth-code-box">
                <span class="auth-code" th:text="${authCode}">000000</span>
            </div>

            <p style="font-size: 14px; color: #666;">* 본 인증번호는 3분 동안만 유효합니다.<br>* 본인이 요청하지 않은 경우 이 메일을 무시해 주세요.</p>
        </div>
        <div class="mail-footer">
            © 2026 DevBridge Labs. All rights reserved.
        </div>
    </div>
</body>

</html>
