# DevBridge 운영 nginx 설정 원본 (EC2 /etc/nginx/ 아래 사이트 설정으로 반영)
#
# ⚠️ 초안: 운영 서버 덤프(`sudo nginx -T`)와 아직 대조하지 않았다. 반영 전에 infra/nginx/README.md의
#    「서버 확인 필요 항목」을 덤프와 대조하고, 운영에만 있는 location·설정은 이 파일로 옮긴 뒤 반영한다.
#    대조 없이 덮어쓰면 운영에만 있던 설정(프론트 정적 서빙 등)이 사라질 수 있다.
#
# 이 파일은 http 컨텍스트에 include되는 것을 전제로 한다(conf.d / sites-enabled).

# WebSocket 핸드셰이크의 ?token=<JWT>를 access log에서 가린다.
#   /ws/chat?token=abc&x=1  → /ws/chat?token=***&x=1
#   /ws/chat?token=abc      → /ws/chat?token=***
#   /ws/chat?a=1&token=abc  → /ws/chat?a=1&token=***
#   /api/foo                → /api/foo (그대로)
map $request_uri $masked_request_uri {
    ~^(?<pre>.*[?&]token=)[^&]*(?<post>.*)$  "${pre}***${post}";
    default                                   $request_uri;
}

# 기본 combined 형식에서 $request(쿼리 포함 원문)만 마스킹된 URI로 바꾼 형식
log_format masked '$remote_addr - $remote_user [$time_local] '
                  '"$request_method $masked_request_uri $server_protocol" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent"';

server {
    # 서버 확인: 2026-06 기준 nginx는 80만 리스닝했고 TLS는 앞단(Cloudflare 추정)에서 종료했다.
    # nginx에서 TLS를 종료한다면 listen 443 ssl과 인증서 경로(경로 문자열만)를 덤프 값으로 추가한다.
    listen 80;
    server_name devbridge-ax.cloud;

    access_log /var/log/nginx/devbridge.access.log masked;

    # 백엔드 REST API
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 서버 확인: 앞단에서 TLS를 종료하면 $scheme은 http가 된다. 그 경우 $http_x_forwarded_proto로 바꾼다.
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 백엔드 WebSocket (WebSocketContract.PATH_PREFIX = "/ws"). 없으면 운영에서만 연결이 실패한다(2026-06-25 사례).
    location /ws/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 유휴 연결은 이 시간이 지나면 끊긴다(nginx 기본 60s). 서버 확인: 덤프에 값이 있으면 그 값을 따른다.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # error log는 형식 지정이 안 되고 업스트림 오류(502 등) 시 요청 줄을 토큰 원문째 남긴다.
        # /ws/만 crit 이상으로 올려 토큰 유출을 막는다. 대신 WS 업스트림 오류 원인은 백엔드 로그에서 본다.
        error_log /var/log/nginx/devbridge.error.log crit;
    }

    # 서버 확인: 프론트 정적 파일(location /), client_max_body_size(업로드 상한, KHS K-F1과 함께 결정)는
    # 덤프에 있으면 그 값을 여기에 옮긴다. 추측으로 채우지 않았다.
}
