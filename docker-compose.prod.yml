services:
  mysql:
    image: mysql:8.0
    container_name: devbridge-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
    volumes:
      - ./mysql-data:/var/lib/mysql
      - ./init-db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - devbridge-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:alpine
    container_name: devbridge-redis
    ports:
      - "6379:6379"
    volumes:
      - ./redis-data:/data
    networks:
      - devbridge-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  app:
    image: ${APP_IMAGE}
    container_name: devbridge-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_HOST: mysql
      SPRING_DATASOURCE_PORT: 3306
      SPRING_DATASOURCE_DATABASE: "${MYSQL_DATABASE}"
      SPRING_DATASOURCE_USERNAME: "${MYSQL_USER}"
      SPRING_DATASOURCE_PASSWORD: "${MYSQL_PASSWORD}"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      INTERNAL_API_KEY: "${INTERNAL_API_KEY}"
      # AI 엔진 프로덕션 URL (같은 EC2라면 localhost:8000 이나 내부망 IP 사용, 아래는 동일 네트워크 기준)
      AI_ENGINE_BASE_URL: http://ai-engine:8000
      AI_ENGINE_INTERNAL_API_KEY: "${INTERNAL_API_KEY}"
      FASTAPI_BASE_URL: http://ai-engine:8000
      # 프로덕션에서는 Git 레포 경로가 다를 수 있으므로 EC2 볼륨 마운트에 맞게 설정
      DEVBRIDGE_GIT_REPOSITORY_PATH: /app/git-repos/devbridge-backend
      SPRING_MAIL_USERNAME: "${SPRING_MAIL_USERNAME}"
      SPRING_MAIL_PASSWORD: "${SPRING_MAIL_PASSWORD}"
      SPRING_PROFILES_ACTIVE: prod
    volumes:
      - ./uploads:/app/uploads
      # EC2 호스트에서 관리할 실제 git-repos 경로 마운트 필요
      # 예: - /home/ubuntu/git-repos:/app/git-repos
      - ./git-repos:/app/git-repos
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - devbridge-network
    restart: always

